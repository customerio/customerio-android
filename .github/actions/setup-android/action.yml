name: Setup Android
description: Setup CI with Android development tools to compile and test Android source code.

runs:
  using: "composite"
  steps:
    - name: Install Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        # The action defaults to "tools platform-tools", and Google has removed the
        # obsolete "tools" package from the SDK repository, so the default now exits 1.
        packages: platform-tools

    - name: Verify Gradle scripts are valid
      uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    - name: Setup Gradle and cache dependencies
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
