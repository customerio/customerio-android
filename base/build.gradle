import io.customer.android.Dependencies
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'java-library'
    id 'kotlin'
}

apply plugin: 'io.customer.android.publish-module'

customerIoPublish {
    artifactId = "base"
}
apply from: "${rootDir}/scripts/codecov-java.gradle"

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(KotlinCompile).configureEach {
    compilerOptions {
        // Same Kotlin language/API pin as scripts/android-config.gradle.
        languageVersion.set(KotlinVersion.KOTLIN_2_1)
        apiVersion.set(KotlinVersion.KOTLIN_2_1)
        optIn.addAll(
                'kotlin.RequiresOptIn',
                'io.customer.base.internal.InternalCustomerIOApi'
        )
    }
}

dependencies {
    implementation Dependencies.coroutinesCore
    implementation Dependencies.androidxAnnotations

    testImplementation "junit:junit:4.13.2"
    testImplementation Dependencies.kluentJava
}