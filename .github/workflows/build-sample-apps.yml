name: Build sample apps

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]
  push:
    branches: [ main, feature/* ]
  release: # build sample apps for every git tag created. These are known as "stable" builds that are suitable for people outside the mobile team. 
    types: [ published ]
  workflow_dispatch:

concurrency: # cancel previous workflow run if one exists. 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Metadata edits rerun full so a newer skipped check cannot replace a failure.
  update-pr-comment:
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action == 'edited' ||
      github.event.action == 'labeled' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full') ||
      startsWith(github.event.pull_request.title, 'fix:') ||
      startsWith(github.event.pull_request.title, 'fix(') ||
      startsWith(github.event.pull_request.title, 'feat:') ||
      startsWith(github.event.pull_request.title, 'feat(') ||
      startsWith(github.event.pull_request.title, 'perf:') ||
      startsWith(github.event.pull_request.title, 'perf(') ||
      startsWith(github.event.pull_request.title, 'revert:') ||
      startsWith(github.event.pull_request.title, 'revert(') ||
      startsWith(github.event.pull_request.title, 'Revert "') ||
      contains(github.event.pull_request.body, 'This reverts commit') ||
      contains(github.event.pull_request.title, '!:') ||
      contains(github.event.pull_request.body, 'BREAKING CHANGE:') ||
      contains(github.event.pull_request.body, 'BREAKING CHANGES:') ||
      contains(github.event.pull_request.body, 'BREAKING-CHANGE:')) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # to be able to comment on PR
    steps:
      - uses: actions/checkout@v4 # required to use the local action below

      # Claims the comment early so it shows builds are on the way. The build workflow rewrites it with results.
      - uses: ./.github/actions/update-sample-app-comment
        with:
          status: "⏳ Building the sample apps..."

  build-sample-apps:
    # Release-bearing PRs mirror semantic-release automatically. `ci:full`
    # remains an override for non-release PRs.
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      ((github.event.action == 'edited' ||
      github.event.action == 'labeled' ||
      contains(github.event.pull_request.labels.*.name, 'ci:full') ||
      startsWith(github.event.pull_request.title, 'fix:') ||
      startsWith(github.event.pull_request.title, 'fix(') ||
      startsWith(github.event.pull_request.title, 'feat:') ||
      startsWith(github.event.pull_request.title, 'feat(') ||
      startsWith(github.event.pull_request.title, 'perf:') ||
      startsWith(github.event.pull_request.title, 'perf(') ||
      startsWith(github.event.pull_request.title, 'revert:') ||
      startsWith(github.event.pull_request.title, 'revert(') ||
      startsWith(github.event.pull_request.title, 'Revert "') ||
      contains(github.event.pull_request.body, 'This reverts commit') ||
      contains(github.event.pull_request.title, '!:') ||
      contains(github.event.pull_request.body, 'BREAKING CHANGE:') ||
      contains(github.event.pull_request.body, 'BREAKING CHANGES:') ||
      contains(github.event.pull_request.body, 'BREAKING-CHANGE:')) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    needs: [ update-pr-comment ] # wait for PR comment to be created saying new builds are being made.
    uses: ./.github/workflows/reusable_build_sample_apps.yml
    with:
      use_latest_sdk_version: false
    secrets: inherit
