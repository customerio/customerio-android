name: Semantic PR helper

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
    # Replaces levibostian/action-conventional-pr-linter, which has no Node 24 release. Same
    # conventional-commits parser; `types` is the list that linter accepted (amannn's default
    # list has no `feature`).
    - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        types: |
          feat
          feature
          fix
          perf
          revert
          docs
          style
          chore
          refactor
          test
          build
          ci
