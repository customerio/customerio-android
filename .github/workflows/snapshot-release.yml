name: Publish Snapshot builds

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]
    paths-ignore:
      - '**/*.md'

concurrency:
  # Unrelated labels and body-only edits must not cancel an in-flight release or
  # ci:full run. They share a separate group from meaningful validation events.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'pull_request' &&
      ((github.event.action == 'labeled' && github.event.label.name != 'ci:full') ||
      (github.event.action == 'edited' &&
      !github.event.changes.title &&
      !github.event.changes.base)) &&
      'metadata' || 'validation'
    }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # Write access needed to create a comment.

jobs:
  release_policy:
    uses: ./.github/workflows/reusable-release-policy.yml
    permissions:
      contents: read
    with:
      pr_title: ${{ github.event.pull_request.title }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      ci_full: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}

  publish:
    name: Snapshot build and publish
    needs: release_policy
    if: >-
      always() &&
      needs.release_policy.outputs.full_validation == 'true' &&
      (github.event.action != 'edited' || github.event.changes.title.from != '') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:full') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      snapshot_version: ${{ steps.set-snapshot-version.outputs.VERSION }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup-android

      # Using branch name for name of snapshot. Makes it easy to remember and can easily trigger new builds of Remote Habits. 
      - name: Set snapshot version 
        id: set-snapshot-version
        env:
          # Get the current branch name and replace all / characters with - as / is invalid in gradle names.
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: echo "VERSION=${PR_HEAD_REF//\//-}-SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Publish to MavenCentral
        run: ./gradlew publishReleasePublicationToSonatypeRepository
        env:
          OSSRH_USERNAME: ${{ secrets.GRADLE_PUBLISH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.GRADLE_PUBLISH_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.GRADLE_SIGNING_KEYID }}
          SIGNING_PASSWORD: ${{ secrets.GRADLE_SIGNING_PASSPHRASE }}
          SIGNING_KEY: ${{ secrets.GRADLE_SIGNING_PRIVATE_KEY }}
          SONATYPE_STAGING_PROFILE_ID: ${{ secrets.SONATYPE_STAGING_PROFILE_ID }}
          MODULE_VERSION: ${{ steps.set-snapshot-version.outputs.VERSION }}
          SNAPSHOT: true

      - name: Find old comment to update comment for
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        id: find-previous-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Build available to test

      - name: Inform pull request on build of SDK available to test 
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          comment-id: ${{ steps.find-previous-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Build available to test
            Version: `${{ steps.set-snapshot-version.outputs.VERSION }}`
            Repository: `https://central.sonatype.com/repository/maven-snapshots/`
          edit-mode: replace
          token: ${{ secrets.GITHUB_TOKEN }}

  # Build compatibility is correctness coverage, so it runs for every code PR
  # independently of release naming. Snapshot publication remains a side effect
  # owned by the release-aware job above.
  gradle-compatibility-builds:
    name: Sample apps build with AGP 8.9.1
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup local.properties file for sample app
        # These APKs compile the PR's local SDK modules and are not distributed,
        # so workspace credentials and a published snapshot are unnecessary.
        run: |
          {
            printf 'siteId=ci-build-placeholder\n'
            printf 'cdpApiKey=ci-build-placeholder\n'
          } > "samples/local.properties"

      - name: Update files for Gradle compatibility
        # API 36 requires AGP 8.9.1 or newer, and AGP 8.9 requires Gradle 8.11.1.
        # https://developer.android.com/build/releases/about-agp#api-level-support
        run: |
          ./scripts/update-gradle-compatibility.sh \
          --agpVersion 8.9.1 \
          --gradleVersion 8.11.1

      # Uses the same Java, Android SDK, wrapper validation, and Gradle-owned
      # caching path as the rest of this repository's CI.
      - uses: ./.github/actions/setup-android

      # Build the Groovy and Kotlin DSL consumers together so their shared SDK
      # modules are configured and compiled only once.
      - name: Build Groovy and Kotlin DSL sample apps
        run: ./gradlew :samples:java_layout:assembleRelease :samples:kotlin_compose:assembleRelease
