name: Build sample app for SDK release
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      sdk_version:
        description: "Published SDK version the sample apps should be built against."
        type: string
        required: false
        default: ""

jobs:
  wait-for-registry:
    name: Wait for published SDK artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      sdk_version: ${{ steps.resolve-version.outputs.sdk_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the published SDK version
        id: resolve-version
        shell: bash
        env:
          SDK_VERSION_INPUT: ${{ inputs.sdk_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          sdk_version="$SDK_VERSION_INPUT"
          if [[ -z "$sdk_version" ]]; then
            if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
              echo "::error::Release sample builds require the SDK version that was just published."
              exit 1
            fi
            sdk_version=$(git describe --tags --abbrev=0)
          fi
          echo "sdk_version=$sdk_version" >> "$GITHUB_OUTPUT"

      - name: Wait for Maven Central downloads
        uses: customerio/mobile-ci-tools/github-actions/wait-until-downloadable/v1@main
        with:
          ecosystem: maven
          version: ${{ steps.resolve-version.outputs.sdk_version }}
          # Include the samples' transitive SDK dependencies as well as their direct ones.
          packages: |
            io.customer.android:base
            io.customer.android:core
            io.customer.android:tracking-migration
            io.customer.android:datapipelines
            io.customer.android:messaging-push-fcm
            io.customer.android:messaging-in-app
            io.customer.android:messaging-in-app-compose
            io.customer.android:messaging-inbox
            io.customer.android:location
            io.customer.android:geofence

      # A timed-out wait skips build-sample-apps, so its Slack step never runs; report it here.
      - name: Notify team the sample builds didn't start
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v2.0.0-rc.3
        if: ${{ failure() }} # only run this if any previous step failed
        with:
          webhook: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          # Use block kit for format of the JSON payloads: https://app.slack.com/block-kit-builder
          # toJSON quotes and escapes the text, so the version can't produce invalid JSON.
          payload: |
            {
              "text": "Android SDK sample apps failure",
              "username": "Android deployment bot",
              "icon_url": "https://media.pocketgamer.com/artwork/na-qulrguj/android.jpg",
              "channel": "#mobile-deployments",
              "blocks": [
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*Android* SDK sample apps :warning: failure :warning:"
                      }
                  },
                  {
                      "type": "divider"
                  },
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": ${{ toJSON(format('Sample apps for Android SDK *{0}* were not built: Maven Central could not be confirmed to serve every artifact. View <https://github.com/{1}/actions/runs/{2}|CI server logs> and re-run the failed jobs once the artifacts are downloadable.', steps.resolve-version.outputs.sdk_version, github.repository, github.run_id)) }}
                      }
                  }
              ]
            }

  build-sample-apps:
    needs: wait-for-registry
    uses: ./.github/workflows/reusable_build_sample_apps.yml
    with:
      use_latest_sdk_version: true
      sdk_version: ${{ needs.wait-for-registry.outputs.sdk_version }}
    secrets: inherit
