import io.customer.android.Dependencies
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

apply plugin: 'io.customer.android.publish-module'
customerIoPublish {
    artifactId = "geofence"
}

apply from: "${rootDir}/scripts/android-config.gradle"
apply from: "${rootDir}/scripts/codecov-android.gradle"
apply from: "${rootDir}/scripts/android-module-testing.gradle"

android {
    namespace 'io.customer.geofence'
    defaultConfig {
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.withType(KotlinCompile).all {
    kotlinOptions {
        freeCompilerArgs += [
                '-opt-in=io.customer.base.internal.InternalCustomerIOApi',
        ]
    }
}

// The replay tests read a private scenario corpus from outside this repo, found the way
// `Scenarios.resolve` finds it: `CIO_GEOFENCE_SCENARIOS`, else `mobile-replay-harness/scenarios` in
// this module or up to five directories above it. Gradle cannot see either on its own, so without
// these inputs a changed corpus — or a different one, or none — reuses the previous run's results.
tasks.withType(Test).configureEach {
    def override = providers.environmentVariable("CIO_GEOFENCE_SCENARIOS").orNull
    File corpus = null
    if (override?.trim()) {
        corpus = file(override)
    } else {
        def dir = projectDir
        for (int i = 0; i < 6 && dir != null && corpus == null; i++) {
            def candidate = new File(dir, "mobile-replay-harness/scenarios")
            if (candidate.isDirectory()) corpus = candidate
            dir = dir.parentFile
        }
    }
    inputs.property("geofenceScenarioRoot", corpus?.absolutePath ?: "")
    if (corpus?.isDirectory()) {
        inputs.files(fileTree(corpus) { include "*.scenario.ndjson" })
                .withPropertyName("geofenceScenarios")
                .withPathSensitivity(PathSensitivity.RELATIVE)
    }
}

dependencies {
    api project(":base")
    api project(":core")
    api project(":location")

    implementation Dependencies.googlePlayServicesLocation
    implementation Dependencies.androidxProcessLifecycle
    implementation Dependencies.coroutinesCore
    implementation Dependencies.coroutinesAndroid
    implementation Dependencies.workManager

    testImplementation Dependencies.workManagerTesting
}
