import io.customer.android.Dependencies
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

apply plugin: 'io.customer.android.publish-module'

customerIoPublish {
    artifactId = "messaging-in-app"
}
apply from: "${rootDir}/scripts/android-config.gradle"
apply from: "${rootDir}/scripts/codecov-android.gradle"
apply from: "${rootDir}/scripts/android-module-testing.gradle"

// Emit real Java default methods for interface members that declare a body, instead of Kotlin's
// default `DefaultImpls`-only shape. Without this, a defaulted member is still `abstract` in the
// bytecode, so every Java class implementing one of our public listeners is forced to override it —
// adding an optional callback would be a source-breaking change for Java hosts.
//
// `all-compatibility` (rather than `all`) also keeps generating the `DefaultImpls` shims, so code
// already compiled against the previous shape continues to link. Dropping to `all` would remove
// them and break binary compatibility.
tasks.withType(KotlinCompile).all {
    kotlinOptions {
        freeCompilerArgs += [
                '-Xjvm-default=all-compatibility',
        ]
    }
}

android {
    namespace 'io.customer.messaginginapp'
    defaultConfig {
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }
    
}

dependencies {
    api project(":base")
    api project(":core")

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.3.1"
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    implementation Dependencies.reduxKotlin
    // Flow is part of the public inline-message availability API.
    api Dependencies.coroutinesCore
    implementation Dependencies.coroutinesAndroid
    implementation Dependencies.androidxAppCompat
    implementation Dependencies.retrofit
    implementation Dependencies.okhttp
    implementation Dependencies.androidxProcessLifecycle
}

// Allows CI to compile and run the SSE compatibility tests against the OkHttp versions commonly
// selected by host applications, without changing the SDK's published dependency version.
def okhttpCompatibilityVersion = providers.gradleProperty("okhttpCompatibilityVersion").orNull
if (okhttpCompatibilityVersion != null) {
    def okhttpCompatibilityArtifact =
            providers.gradleProperty("okhttpCompatibilityArtifact").getOrElse("okhttp")
    configurations.configureEach { configuration ->
        // Changing debugRuntimeClasspath also changes debugCompileClasspath through AGP's
        // consistent resolution. Only swap the test runtime so the SDK still compiles against 4.12.
        if (configuration.name == "debugUnitTestRuntimeClasspath") {
            configuration.resolutionStrategy.eachDependency { details ->
                if (details.requested.group != "com.squareup.okhttp3" ||
                        !(details.requested.name in ["okhttp", "mockwebserver"])) return
                if (details.requested.name == "okhttp" && okhttpCompatibilityArtifact != "okhttp") {
                    details.useTarget(
                            "com.squareup.okhttp3:${okhttpCompatibilityArtifact}:${okhttpCompatibilityVersion}"
                    )
                } else {
                    details.useVersion(okhttpCompatibilityVersion)
                }
                details.because("verify the SDK against the host application's OkHttp version")
            }
        }
    }
}
