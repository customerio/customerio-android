          - messagingpush/src/test/java/io/customer/messagingpush/PushTrackingUtilTest.kt#parseLaunchedActivityForTracking_givenBundleWithoutDeliveryData_expectDoNoTrackPush
    outcomes:
      - Opened is tracked for system-rendered CIO notifications only if the push module subscribes before or close to the launching ON_CREATE.
  - id: token
    trigger: FCM issues a new token, or the push module initializes
    steps:
      - id: new-token
        does: onNewToken (service or static companion) sets up Android components and publishes RegisterDeviceTokenEvent.
        code:
          - messagingpush/src/main/java/io/customer/messagingpush/CustomerIOFirebaseMessagingService.kt#onNewToken
          - messagingpush/src/main/java/io/customer/messagingpush/CustomerIOFirebaseMessagingService.kt#handleNewToken
      - id: init-fetch
        does: Module initialize fetches the current token (after a Google Play services check) and publishes RegisterDeviceTokenEvent when non-null.
        code:
          - messagingpush/src/main/java/io/customer/messagingpush/ModuleMessagingPushFCM.kt#getCurrentFcmToken
          - messagingpush/src/main/java/io/customer/messagingpush/provider/FCMTokenProviderImpl.kt#getCurrentToken
        tests:
          - messagingpush/src/test/java/io/customer/messagingpush/ModuleMessagingPushFCMTest.kt#initialize_givenFCMTokenAvailable_expectRegisterToken
          - messagingpush/src/test/java/io/customer/messagingpush/ModuleMessagingPushFCMTest.kt#initialize_givenNoFCMTokenAvailable_expectDoNotRegisterToken
          - messagingpush/src/test/java/io/customer/messagingpush/provider/FCMTokenProviderTest.kt#test_getCurrentToken_givenPlayServicesUnavailable_logUnavailable
      - id: register
        does: DataPipelines ignores blank tokens, saves the token in GlobalPreferenceStore and sends device attributes; tokens published before init wait in the EventBus replay buffer.
        code:
          - datapipelines/src/main/kotlin/io/customer/sdk/CustomerIO.kt#subscribeToJourneyEvents
          - datapipelines/src/main/kotlin/io/customer/sdk/CustomerIO.kt#registerDeviceTokenImpl
          - core/src/main/kotlin/io/customer/sdk/communication/EventBus.kt#EventBusImpl
    outcomes:
      - The current token is re-registered on every SDK init, so a missed onNewToken is recovered on next launch.
invariants: [sdk-may-be-uninitialized, metrics-are-a-cross-platform-contract]
open_questions:
  - id: P1
    status: bug
    question: "pushMessageProcessor captures config at first access; if a push or click arrives before init, does the default config stick for the process?"
    answer: "Yes (verified). Expected: config set at init applies to every push handled after init in that process. See known_issues P1."
  - id: P2
    status: bug
    question: "Opened metric from a click before init: is it persisted like delivered?"
    answer: "No (verified). It only lives in the in-memory EventBus replay buffer. Expected: opened survives process death before init. See known_issues P2."
  - id: P3
    status: answered
    question: "Delivery worker fails without retry on first launch (no saved settings). Intended?"
    answer: "Yes. Settings are not available yet, so an immediate retry would fail too; the foreground handoff after init is the retry path."
  - id: P4
    status: discuss
    question: "Live channel is created before the live-type check, so a disabled type still registers a channel (and tracks delivered). Intended?"
    answer: "Verified behavior; owner not sure of the intended live notification behavior. Code: CustomerIOPushNotificationHandler.kt (live detection), LiveNotificationHandler.kt (type gate), livenotification/*."
  - id: P5
    status: bug
    question: "Opened tracking from launcher-intent extras with late wrapper init: do wrappers work around it?"
    answer: "Flutter: no workaround. React Native: only onNewIntent (warm start), not cold start. Expo: early native init only when the plugin config is set. See known_issues P5."
  - id: P6
    status: answered
    question: "GCM receiver and FCM service may both see a message; is the 10-entry in-memory dedupe the intended guard?"
    answer: "Yes, intended. Added to stop duplicate delivered events; CDP now also drops duplicates, but dropping obvious duplicates locally stays."
  - id: P7
    status: limitation
    question: "Notification id is a millisecond timestamp; two pushes in the same millisecond collide. Acceptable?"
    answer: "Accepted limitation: assumes no two pushes arrive in the same millisecond."
  - id: P8
    status: answered
    question: "Image download blocks the FCM thread for up to ~8s. Acceptable?"
    answer: "Yes, intended: show the image within the OS budget (~10s before the process may be killed); on failure, post without the image."
known_issues:
  - id: P1
    kind: bug
    verified: true
    expected: Customer push config (autoTrackPushEvents, notificationCallback, pushClickBehavior) applies to every push and click handled after CustomerIO.initialize.
    expected_from: owner P1
    actual: pushMessageProcessor is a singleton built on first access; if that happens before init (killed-app push, common on wrappers) it keeps MessagingPushModuleConfig.default() for the rest of the process.
    evidence: [messagingpush/src/main/java/io/customer/messagingpush/di/DiGraphMessagingPush.kt#pushMessageProcessor, messagingpush/src/main/java/io/customer/messagingpush/processor/PushMessageProcessorImpl.kt#PushMessageProcessorImpl]
  - id: P2
    kind: bug
    verified: true
    expected: An opened metric survives process death before SDK init, like delivered does.
    expected_from: owner P2
    actual: Opened is only published to the in-memory EventBus (replay 100); lost if the process dies before init or init never runs in it.
    evidence: [messagingpush/src/main/java/io/customer/messagingpush/processor/PushMessageProcessorImpl.kt#PushMessageProcessorImpl, core/src/main/kotlin/io/customer/sdk/communication/EventBus.kt#EventBusImpl]
  - id: P5
    kind: bug
    verified: false
    expected: Opened metric is tracked when a wrapper app is cold-started from a push tap and the SDK initializes later from JS/Dart.
    expected_from: owner P5
    actual: Launcher-intent tracking relies on lifecycle callbacks with replay=1, so the launch event is likely replaced before the module subscribes. Wrappers have no workaround on Android (Flutter none, React Native warm start only, Expo only with native init config).
    confirm_with: In the Flutter or React Native sample, kill the app, tap a push, initialize from Dart/JS, and check whether an opened metric is sent.
